<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>اختبارات الحاسبة</title>
<style>body{font-family:Tahoma,Arial;padding:16px}.ok{color:#0a7a3d}.bad{color:#b3261e;font-weight:bold}</style></head>
<body><h1>اختبارات الحاسبة</h1><ul id="out"></ul>
<script src="config.js"></script><script src="calculator.js"></script>
<script src="tests.js"></script>
<script>
const out=document.getElementById("out");
runTests().forEach(t=>{const li=document.createElement("li");li.className=t.pass?"ok":"bad";li.textContent=(t.pass?"✔ ":"✘ ")+t.name+(t.pass?"":` (المتوقع ${t.exp} والناتج ${t.got})`);out.appendChild(li);});
</script></body></html>
